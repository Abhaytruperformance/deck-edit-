<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Tru Performance Deliverables</title>
    <link rel="icon" type="image/png" href="/static/tru-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-shell">
        <aside class="auth-hero">
            <img src="/static/tru-logo-white.png" alt="Tru Performance">
            <div>
                <h2>Client deliverables, drafted and delivered.</h2>
                <p>Collect a brief, let AI draft the deck or workbook, refine it block by block, and publish a shareable link.</p>
            </div>
            <p style="font-size:12.5px; margin:0;">&copy; Tru Performance</p>
        </aside>
        <div class="auth-form-side">
            <div class="auth-card">
                <img class="mobile-logo" src="/static/tru-logo.png" alt="Tru Performance">
                <h1 style="margin-bottom: var(--space-1);">Welcome back</h1>
                <p class="text-muted" style="margin-bottom: var(--space-5);">Log in to manage client deliverables.</p>
                {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
                <form method="post" action="/login" class="form-card">
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required autofocus autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" required autocomplete="current-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block">Log in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
