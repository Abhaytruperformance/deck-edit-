<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password required</title>
    <link rel="icon" type="image/png" href="/static/tru-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ style_v() }}">
</head>
<body>
    <div class="share-shell">
        <div class="form-card share-card">
            <img src="/static/tru-logo.png" alt="Tru Performance">
            <h2>This link is password-protected</h2>
            <p class="text-muted">Enter the password you were given to view it.</p>
            {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
            <form method="post" action="/s/{{ slug }}/password">
                <div class="field">
                    <input name="password" type="password" placeholder="Password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-3);">View deliverable</button>
            </form>
        </div>
    </div>
</body>
</html>
