<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password required</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
        <div class="form-card" style="width:100%; max-width:360px; text-align:center;">
            <h2>This link is password-protected</h2>
            {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
            <form method="post" action="/s/{{ slug }}/password">
                <div class="field" style="max-width:none;">
                    <input name="password" type="password" placeholder="Password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">View</button>
            </form>
        </div>
    </div>
</body>
</html>
